name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o projeto do ZIP
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -1)
          echo "ZIP encontrado: $ZIP"
          mkdir -p proj
          unzip -q -o "$ZIP" -d proj
          SETTINGS=$(find proj -name settings.gradle.kts | head -1)
          echo "ROOT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Aceitar licencas do Android
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK: $SDK"
          mkdir -p "$SDK/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$SDK/licenses/android-sdk-license"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        working-directory: ${{ env.ROOT }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar o APK
        run: cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" Espelho.apk

      - name: Publicar o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Espelho (compilação ${{ github.run_number }})
          files: Espelho.apk
